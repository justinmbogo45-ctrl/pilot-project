services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: propfirmmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propfirmmatch}
      POSTGRES_DB: propfirmmatch
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propfirmmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
